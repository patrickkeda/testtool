  # Step 17.5: S100 加密校验（写 efuse 前；provision_tool --get-lifecycle 退出码 4 = 已加密）
  - id: step_17.5
    name: CheckS100LifecycleEncrypted
    type: utility.ssh_exec
    params:
      host: '${robot_ip}'
      username: root
      port: 22
      command: >-
        bash -lc 'chmod 777 /usr/hobot/bin/provision_tool;
        /usr/hobot/bin/provision_tool --get-lifecycle;
        rc=$?;
        if [ "$rc" -eq 4 ]; then
          echo "S100 lifecycle=4 (LIFECYCLE_OHP, encrypted) OK";
          exit 0;
        else
          echo "S100 未加密或 lifecycle 异常, exit=$rc (期望 4)" >&2;
          exit 1;
        fi'
      strict_host_key: false
      expect_zero_exit: true
      connect_timeout: 25
      exec_timeout: 30
      keepalive_sec: 10
    timeout: 45000
    retries: 1
    condition: null

version: '1.0'
metadata:
  name: vita-zebra-print
  description: '斑马打印机模板打印流程'
  author: 'TestTool'
  created_at: '2026-04-27T17:10:00.000000'
  product: Vita01
  station: LABEL
  version: '1.0'

variables:
  zebra_printer_name: 'ZDesigner 110Xi4 600 dpi (副本 1)'

steps:
  - id: step_1
    name: ScanSN
    type: scan.sn
    params:
      dialog_title: '扫描SN用于标签打印'
      hint: '请扫描或输入SN，确认后进行标签打印'
      regex: '^[A-Z0-9_-]{6,64}$'
      timeout_ms: 60000
    timeout: 65000
    retries: 2
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_2
    name: ZebraTemplatePrint
    type: printer.zebra
    params:
      channel: local
      printer_name: '${zebra_printer_name}'
      copies: 1
      zpl_file: 'Seq/zebra_sn_label.zpl'
      encoding: 'utf-8'
      timeout_ms: 3000
      preview: true
      preview_only: false
      save_preview: true
      preview_dir: 'Result/print_preview'
      preview_file_name: 'label_${sn}.zpl'
    timeout: 20000
    retries: 1
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

timeout: null
retries: 0
on_failure: stop

version: '1.0'
metadata:
  name: dogleg-test-siyue
  description: '狗腿模组检测（思粤方案：扭矩PI控速→到位传感器停止→反向→校验反馈速度）'
  author: 'TestTool'
  created_at: '2026-05-21T00:00:00.000000'
  product: Vita01
  station: DOGLEG
  version: '1.0'

variables:
  plc_serial_port: 'COM3'
  plc_baudrate: 115200
  plc_parity: 'O'
  plc_stopbits: 1
  plc_bytesize: 8
  plc_timeout: 5
  plc_unit_id: 1

  pcan_interface: 'pcan'
  pcan_channel: 'pcan-usb1'
  pcan_baudrate: 1000000

  allowed_motor_ids: "3,6,9,12"
  motor_id: 3
  torque_log_dir: 'Result/dogleg'

  # 思粤：控制扭矩使反馈速度达到目标值（运控 MPC 扭矩环，与 tool.py PI 一致）
  extend_target_speed: 1.0    # 伸腿目标角速度 (rad/s)
  kick_target_speed: -1.0     # 踢腿反向目标角速度 (rad/s)
  extend_torque: 1.0          # 伸腿 PI 扭矩上限 (Nm)
  kick_torque: 1.0
  move_duration_ms: 8000      # 与原版狗腿测试一致：至少运行此时长（传感器未触发时）
  speed_tolerance: 0.25       # 反馈速度峰值与目标的允许偏差 (rad/s)
  motion_min_speed: 0.15      # 峰值速度绝对下限 (rad/s)
  motion_min_feedback: 20
  # 0x01 反馈扭矩 |torque| 超过上限则步骤直接 FAIL（0=不检查）
  max_feedback_torque_nm: 0
  max_extend_feedback_torque_nm: 5.0   # 伸腿 (Nm)，按实测峰值调整
  max_kick_feedback_torque_nm: 5.0
  auto_report_hz: 200
  motor_status_collect_ms: 500

  # PLC 线圈语义（狗腿治具）：
  #   2055 = 伸腿终点到位（到位=1，伸腿前须为 0）
  #   2056 = 原位信号（本治具：原位=0，见 leg_home_expected）  extend_limit_address: 2055
  kick_limit_address: 2056
  leg_home_address: 2056
  leg_home_expected: 0
  kick_start_sensor_address: 2055   # 踢腿前必须先伸腿到位
  kick_start_sensor_expected: 1
  limit_sensor_expected: 1
  extend_limit_idle: 0              # 伸腿前 2055 必须为 0（未在伸腿终点）
  kick_limit_idle: 0
  # 与原版狗腿测试一致：先保证能转起来，到位/速度门限可后续再收紧
  require_home_before_start: false   # 原位 2056 接法未确认前勿卡死
  require_limit_clear_before_start: false  # 2055 常亮时勿挡在 step_9 前
  min_run_ms: 800
  min_speed_before_limit: 0.15       # 与 motion_min_speed 一致，避免永远不停
  sensor_confirm_count: 3
  poll_interval_ms: 20
  max_duration_ms: 60000
  stop_hold_ms: 200

steps:
  - id: step_mes_0
    name: MESInit
    type: mes.heartbeat
    params: {}
    timeout: 8000
    retries: 2
    on_failure: continue

  - id: step_1
    name: ScanSN
    type: scan.sn
    params: {}
    timeout: 60000
    retries: 3
    on_failure: fail

  - id: step_mes_1
    name: MesStartCheckStation
    type: mes.get_work_order
    params:
      sn: '${sn}'
      expected_station: '${mes.effective_station}'
    timeout: 15000
    retries: 1
    on_failure: continue

  - id: step_2
    name: PlcConnect
    type: plc.modbus.connect
    params:
      port: '${plc_serial_port}'
      baudrate: ${plc_baudrate}
      parity: 'O'
      stopbits: 1
      bytesize: 8
      timeout: ${plc_timeout}
      unit_id: ${plc_unit_id}
    timeout: 10000
    retries: 3
    on_failure: fail

  - id: step_3
    name: FixtureStart
    type: plc.modbus.write_register
    params:
      address: 2049
      value: 1
      unit_id: ${plc_unit_id}
      use_coil: true
      description: '启动狗腿治具设备'
    timeout: 5000
    retries: 2
    on_failure: fail

  - id: step_4
    name: LeftPowerOn
    type: plc.modbus.write_register
    params:
      address: 2052
      value: 1
      unit_id: ${plc_unit_id}
      use_coil: true
      description: '左电源上电'
    timeout: 5000
    retries: 2
    on_failure: fail

  - id: step_5
    name: RightPowerOn
    type: plc.modbus.write_register
    params:
      address: 2053
      value: 1
      unit_id: ${plc_unit_id}
      use_coil: true
      description: '右电源上电'
    timeout: 5000
    retries: 2
    on_failure: fail

  - id: step_6
    name: PcanConnect
    type: pcan.connect
    params:
      interface: '${pcan_interface}'
      channel: '${pcan_channel}'
      baudrate: ${pcan_baudrate}
    timeout: 10000
    retries: 3
    on_failure: fail

  - id: step_7
    name: SearchMotorAuto
    type: pcan.search_motor
    params:
      auto_detect_motor_id: true
      allowed_motor_ids: '${allowed_motor_ids}'
      search_wait_ms: 800
      probe_enable_if_not_found: true
    timeout: 10000
    retries: 2
    on_failure: fail

  - id: step_8
    name: EnableMotor
    type: pcan.enable_motor
    params:
      motor_id: ${motor_id}
    timeout: 10000
    retries: 2
    on_failure: fail

  - id: step_8_1
    name: EnableStatusAutoReport
    type: pcan.set_auto_report
    params:
      enable: true
      frequency_hz: ${auto_report_hz}
      motor_id: ${motor_id}
    timeout: 10000
    retries: 1
    on_failure: fail

  - id: step_8_2
    name: ReadMotorTempBeforeMotion
    type: pcan.read_motor_status
    params:
      motor_id: ${motor_id}
      collect_ms: ${motor_status_collect_ms}
      fail_on_alarm: true
      require_feedback: true
      min_feedback_count: 1
      max_feedback_torque_nm: ${max_extend_feedback_torque_nm}
    timeout: 15000
    retries: 1
    on_failure: fail

  # 注意：主界面执行器「任一步失败即停」，on_failure:continue 无效，勿加可选 PLC 步骤挡路

  # 思粤 步骤1：伸腿（与原版相同 PI 扭矩环，到位 2055 或至少跑满 move_duration_ms）
  - id: step_9
    name: ExtendUntilLimitSensor
    type: pcan.move_until_limit
    params:
      action: 'extend'
      motor_id: ${motor_id}
      sn: '${sn}'
      log_dir: '${torque_log_dir}'
      target_speed: ${extend_target_speed}
      torque_limit: ${extend_torque}
      limit_sensor_address: ${extend_limit_address}
      limit_sensor_expected: ${limit_sensor_expected}
      limit_sensor_idle: ${extend_limit_idle}
      home_sensor_address: ${leg_home_address}
      home_sensor_expected: ${leg_home_expected}
      require_home_before_start: ${require_home_before_start}
      require_sensor_clear_before_start: ${require_limit_clear_before_start}
      timed_fallback_ms: ${move_duration_ms}
      min_run_ms: ${min_run_ms}
      min_speed_before_limit: ${min_speed_before_limit}
      sensor_confirm_count: ${sensor_confirm_count}
      unit_id: ${plc_unit_id}
      poll_interval_ms: ${poll_interval_ms}
      max_duration_ms: ${max_duration_ms}
      stop_hold_ms: ${stop_hold_ms}
      verify_speed: true
      speed_tolerance: ${speed_tolerance}
      min_speed_rad_s: ${motion_min_speed}
      min_feedback_count: ${motion_min_feedback}
      max_feedback_torque_nm: ${max_extend_feedback_torque_nm}
    timeout: 90000
    retries: 1
    on_failure: fail

  # 思粤 步骤2：踢腿（反向）— 匀速直到 2056 回原位（本治具 kick 到位见 kick_limit_address）
  - id: step_10
    name: KickUntilLimitSensor
    type: pcan.move_until_limit
    params:
      action: 'kick'
      motor_id: ${motor_id}
      sn: '${sn}'
      log_dir: '${torque_log_dir}'
      target_speed: ${kick_target_speed}
      torque_limit: ${kick_torque}
      limit_sensor_address: ${kick_limit_address}
      limit_sensor_expected: ${limit_sensor_expected}
      limit_sensor_idle: ${kick_limit_idle}
      home_sensor_address: ${kick_start_sensor_address}
      home_sensor_expected: ${kick_start_sensor_expected}
      require_home_before_start: ${require_home_before_start}
      require_sensor_clear_before_start: ${require_limit_clear_before_start}
      timed_fallback_ms: ${move_duration_ms}
      min_run_ms: ${min_run_ms}
      min_speed_before_limit: ${min_speed_before_limit}
      sensor_confirm_count: ${sensor_confirm_count}
      unit_id: ${plc_unit_id}
      poll_interval_ms: ${poll_interval_ms}
      max_duration_ms: ${max_duration_ms}
      stop_hold_ms: ${stop_hold_ms}
      verify_speed: true
      speed_tolerance: ${speed_tolerance}
      min_speed_rad_s: ${motion_min_speed}
      min_feedback_count: ${motion_min_feedback}
      max_feedback_torque_nm: ${max_kick_feedback_torque_nm}
    timeout: 90000
    retries: 1
    on_failure: fail

  - id: step_10_1
    name: ReadMotorTempAfterMotion
    type: pcan.read_motor_status
    params:
      motor_id: ${motor_id}
      collect_ms: ${motor_status_collect_ms}
      fail_on_alarm: true
      require_feedback: true
      min_feedback_count: 1
    timeout: 15000
    retries: 1
    on_failure: fail

  # 复核：伸腿终点 2055=1，踢腿回原位后 2056=leg_home_expected
  - id: step_11
    name: VerifyExtendLimitSensor
    type: plc.modbus.read_register
    params:
      address: ${extend_limit_address}
      count: 1
      unit_id: ${plc_unit_id}
      use_coil: true
      expected_value: ${limit_sensor_expected}
      description: '复核伸腿到位传感器'
    timeout: 5000
    retries: 2
    on_failure: fail

  - id: step_12
    name: VerifyLegHomeAfterKick
    type: plc.modbus.read_register
    params:
      address: ${leg_home_address}
      count: 1
      unit_id: ${plc_unit_id}
      use_coil: true
      expected_value: ${leg_home_expected}
      description: '复核踢腿后原位线圈 2056=leg_home_expected'
    timeout: 5000
    retries: 2
    on_failure: fail

  - id: step_13
    name: PowerOffAll
    type: plc.modbus.write_register
    params:
      address: 2050
      value: 1
      unit_id: ${plc_unit_id}
      use_coil: true
      description: '狗腿治具全部下电'
    timeout: 5000
    retries: 2
    on_failure: continue

  - id: step_14
    name: PlcDisconnect
    type: plc.modbus.disconnect
    params: {}
    timeout: 5000
    retries: 1
    on_failure: continue

  - id: step_15
    name: PcanDisconnect
    type: pcan.disconnect
    params: {}
    timeout: 5000
    retries: 1
    on_failure: continue

  - id: step_mes_2
    name: MesEnd2UploadResult
    type: mes.upload_result
    params:
      prompt_overall_result: false
      overall_result: '${context.result}'
      error_message: '${context.error_message}'
      use_mes_end: false
    timeout: 15000
    retries: 1
    on_failure: continue

timeout: null
retries: 0
on_failure: stop

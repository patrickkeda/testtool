version: '1.0'
metadata:
  name: pvt-stress-ssh
  description: 'PVT：…→接 Hub→SSH 停→确认进程停→SFTP→MES'
  author: 'TestTool'
  created_at: '2026-05-06T00:00:00.000000'
  product: Vita01
  station: STRESS
  version: '1.0'

# —— 与产线期望流程对照（本 seq）——
# 1) MES：step_mes_0 heartbeat → step_1 扫码 SN → step_mes_1 get_work_order
# 2) 连通 192.168.126.2：step_ping_robot ping robot_ip；SSH 在 step_pvt_stress 内连 pvt_ssh_host（默认同 IP）
# 3) 推文件到 /app：step_pvt_stress 内 remount rw → SFTP → chmod +x → exec（invoke_remote_script 模式）
# 4) 检测返回：stdout/stderr 流式匹配 pass_on_stdout_regex（须晚于「cycle start」：脚本先打 cycle start 再打 locomotion，
#    若仍用 cycle … start + disconnect_early，会在第一轮动作前断 SSH，压测实质未跑。
#    现改为匹配「sleep … (after stand)」：在首次 stand 的 ros2 service call 完成之后才会打这行。
# 5) 校验落盘：step_pvt_verify_script_on_robot 检查 ``pvt_remote_script_path``（与 SFTP 目标一致，勿写死文件名）
# 6) 列远端目录：step_pvt_list_remote_app（cd /app && ls -la，stdout 写入测试日志）
# 7) 拔 Hub 人工确认 → utility.delay（hub_countdown_ms，默认 120min；改小如 120000=120s 便于调试）→
#    倒计时**开始瞬间**写入 ``pvt_hub_countdown_started_at``；「煲机异常」可随时点，「煲机无异常」须倒计时结束后再点（均继续流程）→
#    写入 ``pvt_hub_burnin_outcome``（ok|abnormal）→ 接回 Hub 确认 → **SSH 停止**压测与 bag →
#    **SSH 轮询确认进程已停** → SFTP 拉取 → MES 上传
#
# 【注意】pass_regex_disconnect_early=true 时：一旦匹配 pass_on_stdout_regex 即判本步通过并断开 SSH，
# 远端 bash 内脚本常被终止，板上不会跑满整轮。若要求「脚本在板上跑满再进入 120min」，
# 请将该参数改为 false，并适当加大 exec_timeout / 步骤 timeout。
#
# SSH 使用 Paramiko，主机须为可解析 IP；私钥用户须与 MobaXterm 一致（如 root）。
#
# —— 压测脚本（默认：本机拷到远端 /app 再执行）——
# 默认：invoke_remote_script=true + upload_local_file → 同一 SSH 内 SFTP 到 remote_script_path，
# 再 mount→chmod→执行。将 pvt_upload_local_file 设为 '' 可跳过上传（要求板上已有该路径脚本）。
# 远端文件名：改 ``pvt_remote_script_basename``（及必要时 ``pvt_remote_script_path``）即可，不必改校验步骤里的命令。
# invoke_remote_background：远端 nohup ./ 脚本 + 本会话 tail -f 日志；拔 Hub 断 SSH 后压测仍在板上跑（见 pvt_nohup_log）。
# 备选：pvt_invoke_remote_script=false → 本机脚本经 stdin（bash -s）执行，远端不落盘。
# —— 换电脑后无法启动 / 步骤报错时请先核对 ——
# 1) pvt_script_path：序列默认本机脚本路径；若在「设置 → SSH」中填写「远程上传脚本」，运行时会自动覆盖为本路径。
# 2) Config/config.yaml → ssh.private_key_path：必须指向「本机」私钥文件，否则会 SSH 认证失败。
# 3) robot_ip / pvt_ssh_host：新电脑到狗子/S100 的网络若不同，需改 IP；本机需能 ping 通。
# 4) 启动方式：须在 TestTool 项目根目录执行 python -m src.app.main，否则可能找不到 Config/config.yaml。
# 5) 依赖：本机需已安装 Python 依赖（含 paramiko、PySide6 等），与旧电脑一致。
variables:
  robot_ip: '192.168.126.2'
  robot_port: 3579
  pvt_ssh_host: '192.168.126.2'
  pvt_ssh_user: 'root'
  pvt_invoke_remote_script: true
  pvt_remote_workdir: '/app'
  # 远端 SFTP 目标文件名（须与 remote_script_path 的 basename 一致；仅改此处即可换版本脚本）
  pvt_remote_script_basename: 'pvt_stress_test.sh'
  pvt_remote_script_path: '${pvt_remote_workdir}/${pvt_remote_script_basename}'
  # 本机待上传脚本（可被配置 ssh.import_script_path 覆盖，见设置 → SSH 私钥下方；覆盖时会同步更新 basename）
  pvt_script_path: 'client/vita_engineer_client/pvt_stress_test.sh'
  pvt_upload_local_file: '${pvt_script_path}'
  # 压测循环次数（默认 24；总轮数仍由远端脚本决定，此处仅传 --loops）
  pvt_stress_loops: 24
  pvt_script_args: '--duration 180 --loops ${pvt_stress_loops} --post-stop-sleep 5 --post-jump-sleep 15 --motor-sleep 5'
  # early 模式：约束多久内看到 pass_on_stdout_regex；若改 pass_regex_disconnect_early=false 再加大
  pvt_exec_timeout_sec: 7200
  # nohup 日志（invoke_remote_background=true）；须与远端脚本 basename 一致（见 ssh_exec 默认命名）
  pvt_nohup_log: '/tmp/${pvt_remote_script_basename}.testtool_nohup.log'
  pvt_invoke_remote_background: true
  # Hub 后老化倒计时 120 分钟（毫秒）
  hub_countdown_ms: 7200000
  # SSH 列目录步骤：远端路径（默认 /app）
  pvt_list_remote_dir: '/app'
  # MCAP 等数据目录（与 pvt_stress_test_v4.sh 内 MCAP_RECORD_DIR 默认一致）
  pvt_ota_remote_data_dir: '/ota/pvt_stress_test'
  # 拉取到本机的父目录；空表示使用当前用户 Downloads（完整路径见进度条与测试日志）
  pvt_ota_pull_local_parent: ''

steps:
  # MES 失败用 on_failure: fail：产线模式下由 Worker 失败直跳 mes.upload_result（FAIL）并停，不跑后续 PVT。
  - id: step_mes_0
    name: MESInit
    type: mes.heartbeat
    params: {}
    timeout: 8000
    retries: 2
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_1
    name: ScanSN
    type: scan.sn
    params:
      dialog_title: '扫描/输入产品SN'
      hint: '请扫描/输入SN（共19位，且前5位为80100）后回车'
      regex: '^80100[A-Z0-9]{14}$'
      timeout_ms: 60000
    timeout: 65000
    retries: 3
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_mes_1
    name: MesStartCheckStation
    type: mes.get_work_order
    params:
      sn: '${sn}'
      expected_station: '${mes.effective_station}'
    timeout: 15000
    retries: 1
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_ping_robot
    name: PingRobot
    type: utility.ping_host
    params:
      host: '${robot_ip}'
      count: 1
      timeout_sec: 5
    timeout: 20000
    retries: 1
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_pvt_stress
    name: PvtStressSshScript
    type: utility.ssh_exec
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      invoke_remote_script: '${pvt_invoke_remote_script}'
      remote_script_path: '${pvt_remote_script_path}'
      remote_workdir: '${pvt_remote_workdir}'
      remote_remount_app_rw: true
      upload_local_file: '${pvt_upload_local_file}'
      remote_remount_app_rw_before_upload: true
      invoke_remote_background: '${pvt_invoke_remote_background}'
      invoke_remote_background_log: '${pvt_nohup_log}'
      # invoke_remote=true 时由代码忽略；仅 pvt_invoke_remote_script=false（stdin 模式）时使用
      local_script_file: '${pvt_script_path}'
      script_args: '${pvt_script_args}'
      strict_host_key: false
      # submit 日志在 ros2 call 之前；用 after stand 的 sleep 日志作断点，确保首轮 stand 已调用完成
      pass_on_stdout_regex: 'sleep\s+[0-9]+(?:\.[0-9]+)?s\s+\(after stand\)'
      pass_regex_include_stderr: true
      # true：首轮 stand 完成后本步通过并断开 SSH（远端脚本仍会被终止；要跑满整轮请 disconnect_early=false）
      # false：匹配后仍等到远端脚本自行结束（适合希望压测在板上跑满时）
      pass_regex_disconnect_early: true
      # 仅在 disconnect_early=false 等跑完全程时才有意义
      pass_regex_ignore_script_exit: true
      expect_zero_exit: true
      connect_timeout: 30
      # 最长等待「首轮 stand 完成后的 sleep (after stand)」出现的时间（秒）；匹配后即结束本步
      exec_timeout: '${pvt_exec_timeout_sec}'
      keepalive_sec: 10
    # 本步在 early 模式下很快结束；留足首 cycle 出现前的余量即可
    timeout: 3600000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  # 压测步内已 SFTP 到 remote_script_path；本步校验同一路径存在且非空（路径来自 variables，非写死）
  - id: step_pvt_verify_script_on_robot
    name: VerifyPvtScriptOnRobot
    type: utility.ssh_exec
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      command: bash -lc "test -f '${pvt_remote_script_path}' && test -s '${pvt_remote_script_path}' && echo PVT_SCRIPT_VERIFY_OK"
      strict_host_key: false
      expect_zero_exit: true
      connect_timeout: 30
      exec_timeout: 60
      keepalive_sec: 10
    timeout: 90000
    retries: 1
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  # 远端列出 /app 内容（无正则匹配；stdout 由 ssh_exec 写入日志，便于核对上传结果）
  - id: step_pvt_list_remote_app
    name: ListRemoteAppDir
    type: utility.ssh_exec
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      command: bash -lc "cd ${pvt_list_remote_dir} && pwd && ls -la"
      strict_host_key: false
      expect_zero_exit: true
      connect_timeout: 30
      exec_timeout: 60
      keepalive_sec: 10
    timeout: 90000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_unplug_hub_confirm
    name: UnplugHubConfirm
    type: utility.confirm
    params:
      title: '操作确认'
      message: '请拔掉 Hub（USB 集线器）。拔好后点击「确认」继续进入 120 分钟倒计时；点「取消」将中止流程。'
      confirm_text: '确认'
      cancel_text: '取消'
      allow_cancel: true
    timeout: 120000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_hub_burnin_countdown
    name: HubBurnin120Min
    type: utility.delay
    params:
      duration_ms: '${hub_countdown_ms}'
      title: 'Hub 老化倒计时'
      message: '请保持 Hub 已拔除状态。\n剩余：{mmss}\n「煲机异常」发现故障时可随时点击；「煲机无异常」须倒计时结束后再点（均会进入接 Hub 与拉取数据）。'
      show_countdown: true
      countdown_allow_interrupt: true
      countdown_completion_buttons: true
      countdown_ok_button_text: '煲机无异常'
      countdown_abnormal_button_text: '煲机异常'
      countdown_outcome_context_key: 'pvt_hub_burnin_outcome'
      # 倒计时开始瞬间写入时间戳，供下一步拉取目录命名（与扫描 SN 组合）
      save_countdown_started_at_context_key: 'pvt_hub_countdown_started_at'
    timeout: 7300000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_pvt_reconnect_pull_confirm
    name: ReconnectHubAndPullOtaConfirm
    type: utility.confirm
    params:
      title: '请接回 Hub 并拉取数据'
      message: >-
        煲机结果已记录（${pvt_hub_burnin_outcome}）。请将 Hub 线重新接好，确保本机能 SSH 连到 ${pvt_ssh_host}。
        点击「确认」后将先通过 SSH 停止远端压测脚本（${pvt_remote_script_basename}）及 ros2 bag 录制，**并轮询确认进程已完全退出**，再从 ${pvt_ota_remote_data_dir} 拉取到本机。
        保存位置：若未配置 pvt_ota_pull_local_parent，则为当前 Windows 用户的「下载」文件夹（Downloads）下子目录，名称为 SN_倒计时开始时间_煲机结果（ok 或 abnormal）；配置了 pvt_ota_pull_local_parent 则为该路径下同名子文件夹。拉取时会出现进度条并再次显示完整路径。
        拉取成功后删除远端该目录并重建空目录。点「取消」将中止流程。
      confirm_text: '确认'
      cancel_text: '取消'
      allow_cancel: true
    timeout: 300000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  # 与板上 pvt_stress_test_v*.sh 一致：EXIT trap 会 stop_mcap；此处用 SSH 补一刀，避免 Hub 老化期间仍持续写 MCAP
  - id: step_pvt_ssh_stop_remote_stress_and_recorder
    name: SshStopPvtStressAndRos2Bag
    type: utility.ssh_exec
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      # pgrep 字面量「ros2 bag record」会命中本 bash -lc（命令行含该串）；用 r1+r2 拼出 rosrec，使 /proc 里本 shell 的 argv 不含连续子串，pgrep 不再自匹配。PID 仍用 grep -vxF "$mypid" 双保险。
      command: >-
        bash -lc 'set +e; export TERM=dumb; mypid=$$; r1=ros2; r2='"'"' bag record'"'"'; rosrec="$r1$r2"; script='"'"'${pvt_remote_script_basename}'"'"'; pvt_dir='"'"'${pvt_ota_remote_data_dir}'"'"'; echo '"'"'[TestTool] stop PVT + mcap'"'"'; for pid in $(pgrep -f "$script" 2>/dev/null | grep -vxF "$mypid"); do kill -TERM "$pid" 2>/dev/null; done; sleep 6; for round in 1 2; do for pid in $(pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" | sed "s/ .*//" | grep -vxF "$mypid"); do [ -n "$pid" ] && kill -INT "$pid" 2>/dev/null; done; sleep 6; for pid in $(pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" | sed "s/ .*//" | grep -vxF "$mypid"); do [ -n "$pid" ] && kill -KILL "$pid" 2>/dev/null; done; sleep 4; done; for pid in $(pgrep -f "$script" 2>/dev/null | grep -vxF "$mypid"); do kill -KILL "$pid" 2>/dev/null; done; echo '"'"'[TestTool] stop done'"'"'; exit 0'
      strict_host_key: false
      expect_zero_exit: false
      connect_timeout: 90
      exec_timeout: 240
      keepalive_sec: 10
    timeout: 240000
    retries: 1
    retry_interval_ms: 3000
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  # 轮询直至压测脚本消失，且不再有输出目录在 pvt_ota_remote_data_dir 下的 ros2 bag（避免 BMS 等其它 bag 阻塞）
  - id: step_pvt_ssh_verify_stress_and_recorder_stopped
    name: SshVerifyPvtAndBagFullyStopped
    type: utility.ssh_exec
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      # 轮询最多 90×2s≈3min；rosrec=r1+r2 避免 pgrep「ros2 bag record」命中本 bash -lc（见 stop 步注释）。mypid 从 pgrep 结果中剔除。
      command: >-
        bash -lc 'set +e; export TERM=dumb; mypid=$$; r1=ros2; r2='"'"' bag record'"'"'; rosrec="$r1$r2"; script='"'"'${pvt_remote_script_basename}'"'"'; pvt_dir='"'"'${pvt_ota_remote_data_dir}'"'"'; echo "[TestTool] PVT verify: INT/KILL bags under $pvt_dir..." >&2; for pid in $(pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" | sed "s/ .*//" | grep -vxF "$mypid"); do [ -n "$pid" ] && kill -INT "$pid" 2>/dev/null; done; sleep 8; for pid in $(pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" | sed "s/ .*//" | grep -vxF "$mypid"); do [ -n "$pid" ] && kill -KILL "$pid" 2>/dev/null; done; sleep 4; echo "[TestTool] PVT verify: polling up to 90x2s (stderr progress every 5 rounds)..." >&2; i=1; while [ "$i" -le 90 ]; do o=0; if pgrep -f "$script" 2>/dev/null | grep -vxF "$mypid" | grep -q .; then o=1; fi; if pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" | sed "s/ .*//" | grep -vxF "$mypid" | grep -q .; then o=1; fi; if [ "$i" -eq 1 ] || [ $((i % 5)) -eq 0 ]; then echo "[TestTool] PVT verify: round $i/90 o=$o (0=script+bag clear)" >&2; fi; if [ "$o" -eq 0 ]; then echo PVT_AND_BAG_STOPPED_OK; exit 0; fi; rem=$((i % 10)); if [ "$rem" -eq 0 ]; then for pid in $(pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" | sed "s/ .*//" | grep -vxF "$mypid"); do [ -n "$pid" ] && kill -KILL "$pid" 2>/dev/null; done; sleep 2; fi; i=$((i+1)); sleep 2; done; echo "VERIFY_STOP_TIMEOUT" >&2; echo "[TestTool] PVT verify: diag pgrep script (may include this ssh bash if basename in cmdline):" >&2; pgrep -af "$script" >&2 || true; echo "[TestTool] PVT verify: diag ros bag under $pvt_dir (rosrec; should not match this ssh bash):" >&2; pgrep -af "$rosrec" 2>/dev/null | grep -F "$pvt_dir" >&2 || true; exit 1'
      strict_host_key: false
      expect_zero_exit: true
      connect_timeout: 90
      exec_timeout: 320
      keepalive_sec: 10
    timeout: 420000
    retries: 1
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_pvt_sftp_pull_ota_delete_remote
    name: SftpPullOtaPvtStressDeleteRemote
    type: utility.ssh_sftp_pull_dir
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      remote_dir: '${pvt_ota_remote_data_dir}'
      local_parent_dir: '${pvt_ota_pull_local_parent}'
      local_dir_name: '${sn}_${pvt_hub_countdown_started_at}_${pvt_hub_burnin_outcome}'
      delete_remote_after: true
      strict_host_key: false
      connect_timeout: 30
      exec_timeout: 180
      show_pull_progress: true
      pull_progress_title: 'PVT 数据导出'
    timeout: 3600000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_mes_2
    name: MesEnd2UploadResult
    type: mes.upload_result
    params:
      prompt_overall_result: false
      overall_result: '${context.result}'
      error_message: '${context.error_message}'
      use_mes_end: false
    timeout: 15000
    retries: 1
    condition: null
    expect: null
    on_failure: continue
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

timeout: null
retries: 0
on_failure: stop

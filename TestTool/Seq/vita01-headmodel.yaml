# 等100秒 -> set_zenoh（可选 SSH 查 X5 服务如 systemctl；通过则跳过下电/上电/120s）-> 否则 PLC 下电 -> 3s -> 上电 -> 120s -> 工程模式
- id: step_6b_zenoh

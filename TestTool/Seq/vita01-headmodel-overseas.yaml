version: '1.0'
metadata:
  name: vita01-headmodule-overseas
  description: >-
    VITA 机器人狗头模组测试序列（海外版）。流程与 vita01-headmodel 相同；4G/GNSS 改为经 S100
    跳板 SSH 到 X5 发 AT（Seq/scripts/x5_at_modem_test.py）。需「配置 → 测试站 → 私钥配置」。
  author: TestTool
  created_at: '2025-12-20T00:00:00.000000'
  product: Vita01
  station: HEADMODULE
  version: '1.0-overseas'

  robot_ip: 192.168.126.2
  robot_port: 3579
  x5_ip: 192.168.127.10
  plc_serial_port: COM3
  plc_baudrate: 9600
  plc_parity: O
  plc_stopbits: 1
  plc_bytesize: 8
  plc_timeout: 5
  plc_unit_id: 1

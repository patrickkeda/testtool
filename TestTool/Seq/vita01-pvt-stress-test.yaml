version: '1.0'
metadata:
  name: vita01-pvt-stress-test
  description: 'SSH 在机器人上执行 pvt_stress_test.sh（ROS2 DAG 导航/跳跃/趴下/电机上下电等压测）'
  author: 'TestTool'
  created_at: '2026-05-04T00:00:00.000000'
  product: Vita01
  station: STRESS
  version: '1.0'

# 说明：
# - 脚本仍是 bash + ROS2 + systemd，必须在 S100/Linux 上跑；Windows CMD 不能直接执行。
# - 推荐：local_script_file 指向本机 .sh（可用相对 TestTool 根目录，如 client/vita_engineer_client/...），
#   经 SSH stdin 传给远端 bash -s，不必先拷贝到 S100（环境与 ros2/env 仍在远端）。
# - 远端仍需：默认 /app/script/env.sh、DAG、bms_test、locomotion 等（与脚本一致）。
# - 私钥：「配置 → 测试站 → 私钥配置」或步骤 private_key_file / private_key_env。
variables:
  pvt_ssh_host: "192.168.126.2"
  pvt_ssh_user: "root"
  # 相对 TestTool 根目录；或改为本机绝对路径
  pvt_local_script: "client/vita_engineer_client/pvt_stress_test.sh"
  # 传给脚本的参数（posix shlex；与脚本 --help 一致）
  pvt_script_args: "--loops 1 --duration 180"

steps:
  - id: step_pvt_stress
    name: PvtStressTest
    type: utility.ssh_exec
    params:
      host: '${pvt_ssh_host}'
      username: '${pvt_ssh_user}'
      port: 22
      local_script_file: '${pvt_local_script}'
      script_args: '${pvt_script_args}'
      connect_timeout: 30
      exec_timeout: 3600
      expect_zero_exit: true
      strict_host_key: false
    timeout: 3700000
    retries: 0
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

  - id: step_done
    name: StressSeqComplete
    type: utility.delay
    params:
      duration_ms: 100
    timeout: 2000
    retries: 0
    condition: null
    expect: null
    on_failure: continue
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

timeout: null
retries: 0
on_failure: stop

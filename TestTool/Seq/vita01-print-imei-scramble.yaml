version: '1.0'
metadata:
  name: vita01-print-imei-scramble
  description: '直接打印 IMEI + 扰码 标签（修改 variables 中的 imei/scramble 后运行，无需扫 SN）'
  author: 'TestTool'
  created_at: '2026-06-23T00:00:00.000000'
  product: Vita01
  station: LABEL
  version: '1.0'

variables:
  zebra_printer_name: 'ZDesigner 110Xi4 600 dpi (副本 1)'
  imei: '862419087950894'
  scramble: 'N3TX3A7Y5584147'

steps:
  - id: step_1
    name: PrintImeiScrambleLabel
    type: printer.zebra.image
    params:
      channel: local
      printer_name: '${zebra_printer_name}'
      hardlock_enabled: false
      copies: 1
      imei: '${imei}'
      scramble: '${scramble}'
      imei_font_source: 'Result/font_sources/vbot_zip/Vbot Sans'
      scramble_font_source: 'Result/font_sources/许可标志样式矢量图及字体库'
      save_preview: true
      preview: false
    timeout: 15000
    retries: 1
    condition: null
    expect: null
    on_failure: fail
    at_config: null
    state_measurement_config: null
    manual_judgment_config: null

timeout: null
retries: 0
on_failure: stop
